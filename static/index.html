<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>artintele.ai — Kannada Voice Agent · Demo Console</title>
<style>
  :root{
    --brand:#5b2be0; --brand2:#8a5cff; --ink:#14121f; --muted:#6b6880;
    --bg:#f5f4fb; --card:#ffffff; --line:#e7e4f2; --agent:#5b2be0; --cust:#eceaf6;
    --ok:#17b26a; --warn:#f79009; --live:#e0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;
         padding:18px 28px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{opacity:.85;font-size:12.5px;margin-top:2px}
  .pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;
        background:rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#cfc6f5}
  .dot.live{background:var(--live);box-shadow:0 0 0 0 rgba(224,57,43,.6);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,57,43,.55)}70%{box-shadow:0 0 0 9px rgba(224,57,43,0)}100%{box-shadow:0 0 0 0 rgba(224,57,43,0)}}
  main{display:grid;grid-template-columns:400px 1fr;gap:20px;padding:22px;max-width:1200px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
        box-shadow:0 1px 2px rgba(20,18,31,.04)}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 14px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
        font-size:13.5px;font-family:inherit;background:#fbfaff;color:var(--ink);resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand2);background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns{display:flex;gap:10px;margin-top:18px}
  button{flex:1;border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
  .save{background:#efeafc;color:var(--brand)}
  .call{background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff}
  button:active{transform:translateY(1px)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
  /* transcript */
  #feed{height:calc(100vh - 210px);min-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
  .msg{max-width:78%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg .who{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-bottom:3px}
  .agent{align-self:flex-end;background:var(--agent);color:#fff;border-bottom-right-radius:4px}
  .agent .who{color:#e8e0ff}
  .customer{align-self:flex-start;background:var(--cust);color:var(--ink);border-bottom-left-radius:4px}
  .empty{color:var(--muted);text-align:center;margin:auto;font-size:13px}
  .feedhead{display:flex;justify-content:space-between;align-items:center}
  .clear{flex:none;background:transparent;color:var(--muted);font-size:12px;padding:4px 8px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <header>
    <div>
      <h1>artintele.ai · Kannada Voice Agent</h1>
      <div class="sub">Bengaluru Kanglish tele-caller — live demo console</div>
    </div>
    <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">idle</span></div>
  </header>

  <main>
    <!-- LEFT: context the AI speaks on -->
    <section class="card">
      <h2>Call Context</h2>

      <div class="row">
        <div><label>Customer name</label><input id="custName" placeholder="Rohan" /></div>
        <div><label>Phone (+91…)</label><input id="custPhone" placeholder="+9198XXXXXXXX" /></div>
      </div>

      <label>Call goal</label>
      <textarea id="goal" rows="2" placeholder="What should the agent achieve on this call?"></textarea>

      <label>Offer / pitch</label>
      <input id="offer" placeholder="e.g. Personal loan at twelve percent, no processing fee" />

      <label>Key facts the agent may use (one per line)</label>
      <textarea id="facts" rows="4" placeholder="Interest starts at twelve percent&#10;No processing fee below five lakh"></textarea>

      <label>Do NOT say</label>
      <input id="dns" placeholder="e.g. Do not promise final approval before verification" />

      <div class="row">
        <div>
          <label>Voice (Sarvam speaker)</label>
          <select id="speaker">
            <option value="anushka">anushka (female)</option>
            <option value="manisha">manisha (female)</option>
            <option value="vidya">vidya (female)</option>
            <option value="arya">arya (female)</option>
            <option value="abhilash">abhilash (male)</option>
            <option value="karun">karun (male)</option>
          </select>
        </div>
        <div>
          <label>Model</label>
          <select id="model"><option>bulbul:v2</option><option>bulbul:v3</option></select>
        </div>
      </div>

      <div class="btns">
        <button class="save" onclick="saveContext()">Save context</button>
        <button class="call" onclick="placeCall()">📞 Call now</button>
      </div>
      <div class="hint">Set the context, hit <b>Save</b>, then <b>Call now</b>. The live conversation
        streams on the right. Voice/model apply to the next call placed.</div>
    </section>

    <!-- RIGHT: live conversation -->
    <section class="card">
      <div class="feedhead">
        <h2 style="margin:0">Live Conversation</h2>
        <button class="clear" onclick="clearFeed()">Clear</button>
      </div>
      <div id="feed"><div class="empty">No conversation yet. Place a call to begin.</div></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const feed = $("feed");

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

function setStatus(s){
  $("statusText").textContent = s;
  $("statusDot").classList.toggle("live", s==="in-call"||s==="dialing");
}

function clearFeed(){ feed.innerHTML = '<div class="empty">Cleared. Waiting for the next turn…</div>'; }

function addMsg(role, content){
  const empty = feed.querySelector(".empty"); if(empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + (role === "agent" ? "agent" : "customer");
  el.innerHTML = `<div class="who">${role === "agent" ? "AI · Kavya" : "Customer"}</div>${content}`;
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
}

function collectCampaign(){
  return {
    CALL_TYPE: "outbound",
    GOAL: $("goal").value.trim(),
    OFFER: $("offer").value.trim(),
    KEY_FACTS: $("facts").value.split("\n").map(s=>s.trim()).filter(Boolean),
    DO_NOT_SAY: $("dns").value.trim(),
    SARVAM_TTS_SPEAKER: $("speaker").value,
    SARVAM_TTS_MODEL: $("model").value,
    CUSTOMER: { name: $("custName").value.trim() || "sir/madam", phone: $("custPhone").value.trim() }
  };
}

async function saveContext(){
  const r = await fetch("/api/campaign",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify(collectCampaign())});
  toast(r.ok ? "Context saved ✓" : "Save failed");
}

async function placeCall(){
  await saveContext();
  const to = $("custPhone").value.trim();
  if(!to){ toast("Enter a phone number"); return; }
  const r = await fetch("/api/call",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({to})});
  const d = await r.json();
  toast(d.ok ? "Dialing "+to+" …" : ("Call error: "+(d.error||"unknown")));
}

// prefill from server + open live event stream
(async function init(){
  try{
    const d = await (await fetch("/api/campaign")).json();
    const c = d.campaign || {};
    $("goal").value = c.GOAL||""; $("offer").value = c.OFFER||"";
    $("facts").value = (c.KEY_FACTS||[]).join("\n"); $("dns").value = c.DO_NOT_SAY||"";
    if(c.CUSTOMER){ $("custName").value = c.CUSTOMER.name||""; $("custPhone").value = c.CUSTOMER.phone||""; }
    setStatus(d.status||"idle");
  }catch(e){}

  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/events`);
  ws.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if(e.type === "transcript") addMsg(e.role, e.content);
    else if(e.type === "status") setStatus(e.status);
  };
  ws.onclose = () => setStatus("disconnected");
})();
</script>
</body>
</html>
